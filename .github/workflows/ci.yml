name: CI

on:
    push:
    pull_request:

permissions:
    contents: read

jobs:
    ci:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Bun
              uses: oven-sh/setup-bun@v2

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Type check
              run: bun run type-check

            - name: Test (package script: vitest run)
              run: bun run test

            - name: Build
              run: bun run build:all

            - name: Manifest is up to date
              run: |
                  bun scripts/gen-manifest.ts
                  git diff --exit-code -- src/core/manifest.ts

            - name: Quality gate
              run: bun scripts/quality-gate.ts
