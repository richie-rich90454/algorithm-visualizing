name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"
categories:
  - title: "Features"
    labels:
      - "enhancement"
      - "feature"
      - "new-algorithm"
  - title: "Bug fixes"
    labels:
      - "bug"
      - "fix"
  - title: "Documentation and SEO"
    labels:
      - "documentation"
      - "seo"
  - title: "Maintenance"
    labels:
      - "chore"
      - "tooling"
      - "ci"
change-template: "- $TITLE (#$NUMBER) @$AUTHOR"
change-title-escapes: '\<*_&'
version-resolver:
  major:
    labels:
      - "major"
  minor:
    labels:
      - "minor"
      - "enhancement"
      - "new-algorithm"
  patch:
    labels:
      - "patch"
      - "bug"
      - "fix"
      - "documentation"
  default: patch
exclude-labels:
  - "skip-changelog"
template: |
  ## Changes

  $CHANGES

  **Full changelog:** https://github.com/richie-rich90454/algorithm-visualizing/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION
